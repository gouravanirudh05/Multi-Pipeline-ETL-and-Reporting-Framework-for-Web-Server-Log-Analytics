services:
  postgres:
    image: postgres:15-alpine
    container_name: nosql_etl_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nosql_etl_db
      POSTGRES_USER: sathish
      POSTGRES_PASSWORD: welcome
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sathish -d nosql_etl_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:7
    container_name: nosql_etl_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nosql_etl_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: nosql_etl_db
      PGUSER: sathish
      PGPASSWORD: welcome
      DATABASE_URL: postgresql://sathish:welcome@postgres:5432/nosql_etl_db
      MONGO_URI: mongodb://mongo:27017
      JAVA_HOME: /usr/local/openjdk-8
      HADOOP_HOME: /opt/hadoop
      PIG_HOME: /opt/pig
      HIVE_HOME: /opt/hive
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      HIVE_CONF_DIR: /opt/hive/conf
      PATH: /usr/local/openjdk-8/bin:/opt/hadoop/bin:/opt/hadoop/sbin:/opt/pig/bin:/opt/hive/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    ports:
      - "5050:5050"
      - "9870:9870"
    volumes:
      - hdfsdata:/hadoop-data
      - hivedata:/app/.hive
      - ./data:/app/data

volumes:
  pgdata:
  mongodata:
  hdfsdata:
  hivedata:
